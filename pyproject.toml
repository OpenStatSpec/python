[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openstatspec"
version = "0.0.0"
description = "Reference adapter for the OpenStatSpec relational contract"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "OpenStatSpec"}]
dependencies = ["SQLAlchemy>=2.0", "pandas>=2.2", "pyreadstat>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
openstatspec = "openstatspec.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/openstatspec"]
