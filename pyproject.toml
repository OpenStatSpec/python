[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openstatspec"
version = "0.1.0"
description = "Reference adapter for the OpenStatSpec relational contract"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "OpenStatSpec"}]
dependencies = ["SQLAlchemy>=2.0", "pandas>=2.2", "pyspssio @ git+https://github.com/TonisOrmisson/pyspssio.git@0b3f879"]

[project.optional-dependencies]
dev = ["pytest>=8"]
sql = ["psycopg[binary]>=3.2", "PyMySQL>=1.1"]

[project.scripts]
openstatspec = "openstatspec.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["services: requires a configured PostgreSQL or MySQL/MariaDB service"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/openstatspec"]
