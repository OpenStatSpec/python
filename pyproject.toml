[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openstatspec"
version = "0.4.0"
description = "Reference adapter for the OpenStatSpec relational contract"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "OpenStatSpec"}]
dependencies = ["SQLAlchemy>=2.0", "pandas>=2.2", "openstatspec-pyspssio==0.5.1.post2", "sqlglot>=30.14", "rfc8785>=0.1.4"]

[project.optional-dependencies]
dev = ["pytest>=8"]
sql = ["psycopg[binary]>=3.2", "PyMySQL>=1.1"]

[project.scripts]
openstatspec = "openstatspec.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["services: requires a configured PostgreSQL, MySQL, MariaDB, or Dolt service"]

[tool.hatch.build.targets.wheel]
packages = ["src/openstatspec"]
